name = "iplay"
main = "worker/_worker.js"
compatibility_date = "2026-10-01"
# Workers Builds invokes `wrangler deploy` directly. Preserve optional dashboard
# variables there as well as in the explicit CLI fallback deployment script.
keep_vars = true

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
ENVIRONMENT = "production"
QUARK_CHANNEL_SEARCH = "1"
PANSOUSUO_SEARCH = "1"

# Cloudflare Rate Limiting bindings provide per-location counters at the edge.
# Keep namespace IDs stable; they only need to be unique positive integers in
# the Cloudflare account where this Worker is deployed.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RESOURCE_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 10
period = 60

# Quark share checks come in batches of 12, so one long result list needs
# several requests; they get their own, larger budget.
[[ratelimits]]
name = "QUARK_STATUS_RATE_LIMITER"
namespace_id = "1003"

[ratelimits.simple]
limit = 30
period = 60

[triggers]
crons = ["0 */6 * * *"]

# 如果前端也用 Cloudflare Pages 部署，这个配置可以帮你在同一个项目中管理 Worker
# [build]
# command = "npm run build"
# cwd = ""
# watch_dir = ""

[[durable_objects.bindings]]
name = "WPZY_CACHE_SESSION"
class_name = "WpzyCacheSession"

# Reuse the deployed class with separately named objects for share attempts.
[[durable_objects.bindings]]
name = "QUARK_PASSCODE_ATTEMPTS"
class_name = "WpzyCacheSession"

[[migrations]]
tag = "wpzy-cache-session-v1"
new_sqlite_classes = ["WpzyCacheSession"]

# Branch Previews use isolated storage and independent rate limit counters.
[previews.vars]
ENVIRONMENT = "production"
PANSOUSUO_SEARCH = "1"
QUARK_CHANNEL_SEARCH = "1"

[[previews.durable_objects.bindings]]
name = "WPZY_CACHE_SESSION"
class_name = "WpzyCacheSession"

[[previews.durable_objects.bindings]]
name = "QUARK_PASSCODE_ATTEMPTS"
class_name = "WpzyCacheSession"

[[previews.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1101"

[previews.ratelimits.simple]
limit = 60
period = 60

[[previews.ratelimits]]
name = "RESOURCE_RATE_LIMITER"
namespace_id = "1102"

[previews.ratelimits.simple]
limit = 10
period = 60

[[previews.ratelimits]]
name = "QUARK_STATUS_RATE_LIMITER"
namespace_id = "1103"

[previews.ratelimits.simple]
limit = 30
period = 60
