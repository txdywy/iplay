name: Deploy Cloudflare Worker (manual)

on:
  # Production deploys currently run from a trusted local machine using the
  # local Wrangler OAuth session. Keep this workflow available for a future
  # GitHub-secrets setup, but do not run it on every main push while those
  # secrets are intentionally absent.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets before deploying."
            exit 1
          fi

      - name: Validate Worker upload
        run: npm run wrangler -- deploy --dry-run --strict

      - name: Deploy Worker
        run: npm run wrangler -- deploy --strict --keep-vars --message "GitHub Actions ${GITHUB_SHA}"
